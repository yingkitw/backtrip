[package]
name = "backtrip"
version = "0.1.2"
edition = "2024"
description = "A .NET IL decompiler and CIL disassembler in Rust — turns .NET assemblies (.dll/.exe) back into readable, recompilable C# or IL disassembly, with round-trip verification"
license = "Apache-2.0"
keywords = [
    "decompiler",
    "dotnet",
    "cil",
    "il",
    "csharp"
]
categories = [
    "command-line-utilities",
    "development-tools",
    "parser-implementations",
]
authors = ["Ying Kit WONG"]
repository = "https://github.com/yingkitw/backtrip"
homepage = "https://github.com/yingkitw/backtrip"
documentation = "https://docs.rs/backtrip"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
