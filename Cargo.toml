[package]
name = "backtrip"
version = "0.1.3"
edition = "2024"
description = "A decompiler in Rust — turns .NET assemblies (.dll/.exe) into C# and JVM class files (.class) into Java, with IL/javap-style disassembly and round-trip verification"
license = "Apache-2.0"
keywords = [
    "decompiler",
    "dotnet",
    "cil",
    "java",
    "jvm",
]
categories = [
    "command-line-utilities",
    "development-tools",
    "parser-implementations",
]
authors = ["Ying Kit WONG"]
repository = "https://github.com/yingkitw/backtrip"
homepage = "https://github.com/yingkitw/backtrip"
documentation = "https://docs.rs/backtrip"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
